name: Build leona3 EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Compile C++ menjadi EXE
        run: g++ -static "leona3.cpp" -o "leona3.exe"

      - name: Upload file EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-leona3
          path: "leona3.exe"
